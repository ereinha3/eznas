services:
  threadfin:
    image: fyb3roptik/threadfin:latest
    container_name: threadfin
    restart: unless-stopped
    environment:
      - TZ=UTC
      - PORT=34400
    volumes:
      - ./data:/home/threadfin/data
      - ./config:/home/threadfin/config
    ports:
      - "34400:34400"
      - "34400:34400/udp"
    networks:
      - nas_media_stack_nas_net

networks:
  nas_media_stack_nas_net:
    external: true
