services:
  dispatcharr:
    image: ghcr.io/dispatcharr/dispatcharr:latest
    container_name: dispatcharr
    restart: unless-stopped
    ports:
      - "9191:9191"
    volumes:
      - ./data:/data
      - /home/ethan/eznas/streamharvest/output:/mnt/streamharvest:ro
    environment:
      - DISPATCHARR_ENV=aio
      - DISPATCHARR_LOG_LEVEL=info
    networks:
      - nas_media_stack_nas_net

networks:
  nas_media_stack_nas_net:
    external: true
